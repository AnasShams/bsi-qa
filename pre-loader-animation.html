<title>Black Saber Industries — Logo Animation</title>

<!-- GSAP core (includes the Attr + CSS plugins used below) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
  :root {
    --bg-center: #ffffff;
    --bg-edge: #e9e7e3;
    --accent: #8A1538;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 42%, var(--bg-center) 0%, var(--bg-edge) 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .stage { width: min(760px, 88vw); }

  /*
    The logo is split into two SVGs that share the original coordinate
    system, so the final frame lines up exactly with the source file:
      emblem → viewBox 1170 0 610 790   (horse + slashes)
      text   → viewBox 0 900 2955 585   (BLACK SABER / INDUSTRIES)
    Percentages below = those boxes divided by the full 2955 × 1485 canvas.
  */
  .logo-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 2955 / 1485;
    perspective: 1600px;
    perspective-origin: 50% 30%;
  }

  .emblem-3d {
    position: absolute;
    left: 39.594%;
    top: 0;
    width: 20.643%;
    height: 53.199%;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    will-change: transform, filter, opacity;
  }

  .wire { opacity: 0; }                       /* only visible while animating */
  .wire use {
    fill: none;
    stroke-width: 5;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }

  .text {
    position: absolute;
    left: 0;
    top: 60.606%;
    width: 100%;
    height: 39.394%;
    overflow: visible;
  }

  #caret { opacity: 0; }

  /* ---------- Preview controls (not part of the logo) ---------- */
  .controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .controls button,
  .controls select {
    font: inherit;
    font-size: 14px;
    padding: 8px 16px;
    border: 1px solid #d6d3cf;
    border-radius: 999px;
    background: #fff;
    color: #222;
    cursor: pointer;
  }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
  .controls input[type="range"] { width: 180px; accent-color: var(--accent); }
  .controls output { font-size: 13px; color: #666; min-width: 3.5em; font-variant-numeric: tabular-nums; }
  body.embedded .controls { display: none; }
</style>
</head>

  <button id="replay" type="button">↻ Replay</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Scrub timeline">
  <output id="scrub-label">0.00s</output>
  <select id="speed" aria-label="Playback speed">
    <option value="2">2× fast</option>
    <option value="1" selected>1× speed</option>
    <option value="0.5">0.5× slow</option>
    <option value="0.25">0.25× slow</option>
  </select>
</div>

<script>
(() => {
  const embedded = window.parent !== window;
  const notifyParent = () => {
    if (embedded) window.parent.postMessage("bsi-preloader-complete", "*");
  };

  // No GSAP (offline / CDN blocked) → the static logo is already showing.
  if (!window.gsap) {
    notifyParent();
    return;
  }

  const $  = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  const emblem    = $('#emblem');
  const wires     = $$('.wire');
  const wireUses  = $$('.wire use');
  const solid     = $('#solid');
  const noise     = $('#liquid-noise');
  const disp      = $('#liquid-disp');
  const liquidEls = [...wireUses, $('#horse-fill')];
  const sheen     = $('#sheen');
  const cuts      = $$('.cut');
  const glowGroup = $('#slash-glow');
  const metal     = $('#metal');
  const letters   = $$('#wordmark .letter');
  const tags      = $$('#tagline .tag');
  const caret     = $('#caret');

  // Final widths of the slash cut masks
  const cutWidths = cuts.map(r => +r.getAttribute('width'));

  /*
    TIMELINE (1× speed)
    0.00  Horse surges out of depth: rotated away, tilted forward, tiny & far.
          Four wireframe echoes draw on, spread through Z, liquid-distorted.
    0.00–2.00  Body rears up on its hind hooves (overshoots, then locks).
    0.75  Solid silhouette resolves out of blur (depth of field).
    1.35  Wireframes dissolve into the solid; light sheen rakes across.
    1.95  Liquid distortion switched off → razor-sharp final posture.
    1.50  Three neon/metal slashes cut across the mane (staggered).
    1.65  BLACK SABER rises out of its baseline, letter by letter.
    2.05  INDUSTRIES types on behind a maroon caret.
  */
  const tl = gsap.timeline({ paused: true });

  // ---- 1. Surge forward in 3D, pivoting on the hind hooves ----
  gsap.set(emblem, { transformOrigin: '42% 97%' });

  tl.fromTo(emblem,
    { z: -1100, x: -170, y: 110, rotationY: -72, rotationX: 20 },
    { z: 0, x: 0, y: 0, rotationY: 0, rotationX: 0, duration: 2.0, ease: 'power4.out' },
    0);

  // Rearing: starts pitched forward, rises past vertical, then locks
  tl.fromTo(emblem, { rotation: 26 }, { rotation: -7, duration: 1.25, ease: 'power3.out' }, 0)
    .to(emblem, { rotation: 0, duration: 0.75, ease: 'back.out(2.4)' }, 1.25);

  // ---- 2. Wireframe echoes: draw on, collapse through depth ----
  tl.fromTo(wires,
    {
      z: i => -(i + 1) * 95,
      rotation: i => -(i + 1) * 6,
      rotationY: i => (i + 1) * 9,
      filter: i => `blur(${(i + 1) * 1.8}px)`,
      opacity: 0
    },
    { opacity: i => 0.95 - i * 0.17, duration: 0.35, ease: 'none', stagger: 0.05 },
    0);

  tl.to(wires,
    { z: 0, rotation: 0, rotationY: 0, filter: 'blur(0px)', duration: 1.6, ease: 'expo.inOut', stagger: 0.06 },
    0.1);

  tl.fromTo(wireUses,
    { strokeDashoffset: 1 },
    { strokeDashoffset: 0, duration: 1.3, ease: 'power2.inOut', stagger: 0.07 },
    0);

  tl.to(wires, { opacity: 0, duration: 0.5, ease: 'power1.in', stagger: 0.04 }, 1.35);

  // ---- 3. Liquid distortion winds down ----
  // Low-frequency noise = broad, syrupy warps rather than grain
  tl.set(liquidEls, { attr: { filter: 'url(#liquid)' } }, 0);
  tl.fromTo(disp, { attr: { scale: 90 } }, { attr: { scale: 0 }, duration: 1.7, ease: 'power2.out' }, 0);
  tl.fromTo(noise,
    { attr: { baseFrequency: '0.012 0.02' } },
    { attr: { baseFrequency: '0.004 0.007' }, duration: 1.7, ease: 'sine.out' },
    0);
  tl.set(liquidEls, { attr: { filter: 'none' } }, 1.95);   // crisp final render

  // ---- 4. Solid silhouette resolves out of depth-of-field blur ----
  tl.fromTo(solid,
    { opacity: 0, filter: 'blur(14px)' },
    { opacity: 1, filter: 'blur(0px)', duration: 1.2, ease: 'power2.out' },
    0.75);
  tl.set(solid, { clearProps: 'filter' }, 1.96);

  // ---- 5. Lighting sheen rakes across the body ----
  tl.fromTo(sheen, { attr: { x: 1000 } }, { attr: { x: 1900 }, duration: 1.0, ease: 'power2.inOut' }, 1.3);

  // ---- 6. Mane slashes: stretch out from their left tip + neon flare ----
  const slashEls   = $$('.slash');
  const glowEls    = $$('.glow');
  const slashPivot = ['1276 0', '1270 66', '1364 178'];   // left edge of each slash
  slashEls.forEach((slash, i) => {
    const pair = [slash, glowEls[i]];
    gsap.set(pair, { svgOrigin: slashPivot[i] });
    tl.fromTo(pair, { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: 'expo.out' }, 1.5 + i * 0.09);
  });
  tl.fromTo(glowGroup, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: 'none' }, 1.5)
    .to(glowGroup, { opacity: 0, duration: 0.6, ease: 'power2.out' }, 1.78);

  // ---- 7. BLACK SABER rises from its baseline ----
  tl.fromTo(letters,
    { y: 320, x: i => (i - 4.5) * 22 },
    { y: 0, x: 0, duration: 1.1, ease: 'expo.out', stagger: 0.04 },
    1.65);

  // ---- 8. INDUSTRIES types on behind a caret ----
  gsap.set(tags, { opacity: 0 });
  const typeStart = 2.05, typeStep = 0.055;
  tl.set(caret, { opacity: 1, attr: { x: tags[0].getBBox().x - 34 } }, typeStart - 0.08);
  tags.forEach((tag, i) => {
    const box = tag.getBBox();
    const t = typeStart + i * typeStep;
    tl.set(tag, { opacity: 1 }, t);
    tl.set(caret, { attr: { x: box.x + box.width + 22 } }, t);
  });
  const typeEnd = typeStart + tags.length * typeStep;
  tl.set(caret, { opacity: 0 }, typeEnd + 0.2)
    .set(caret, { opacity: 1 }, typeEnd + 0.45)
    .to(caret, { opacity: 0, duration: 0.25 }, typeEnd + 0.7);

  // ---------------- Preview controls ----------------
  const scrub = $('#scrub');
  const label = $('#scrub-label');
  const sync = () => {
    scrub.value = Math.round(tl.progress() * 1000);
    label.textContent = tl.time().toFixed(2) + 's';
  };
  tl.eventCallback('onUpdate', sync);
  tl.eventCallback('onComplete', notifyParent);

  scrub.addEventListener('input', () => { tl.pause().progress(scrub.value / 1000); sync(); });
  $('#replay').addEventListener('click', () => tl.restart());
  $('#speed').addEventListener('change', e => tl.timeScale(+e.target.value));

  // ?t=1.2 opens frozen at 1.2s; reduced-motion users get the final frame
  const t = new URLSearchParams(location.search).get('t');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    tl.progress(1).pause();
    notifyParent();
  }
  else if (t !== null) tl.pause(+t);
  else tl.play(0);
  sync();
})();
</script>
</body>
</html>
