<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BSI Global Reach</title>
    <style>
      :root {
        color-scheme: dark;
        --accent: #a93b55;
        --panel: #101012;
        --panel-soft: #17171a;
        --text: #f5f3f3;
        --muted: #aaa6a8;
        --line: #333034;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: transparent;
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        padding: 8px;
      }
      .reach-panel {
        width: 100%;
        padding: clamp(18px, 3vw, 30px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
      }
      .reach-heading {
        margin-bottom: 12px;
      }
      .reach-eyebrow {
        margin: 0 0 8px;
        color: #e18a9d;
        font: 600 11px/1.4 ui-monospace, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(20px, 2.4vw, 28px);
        line-height: 1.2;
        font-weight: 600;
      }
      .reach-intro {
        max-width: 680px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .reach-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 260px);
        gap: 18px;
        align-items: center;
      }
      .globe-wrap {
        min-width: 0;
      }
      #globe {
        display: block;
        width: min(100%, 460px);
        height: auto;
        aspect-ratio: 1;
        margin: 0 auto;
        cursor: grab;
        touch-action: pan-y;
      }
      #globe:active {
        cursor: grabbing;
      }
      .location-list {
        display: grid;
        gap: 7px;
      }
      .location {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel-soft);
      }
      .location-dot {
        flex: 0 0 7px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
      }
      .location-country {
        min-width: 0;
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
      }
      .location-city {
        min-width: 0;
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
        text-align: right;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        text-align: center;
      }
      .metric-value {
        color: var(--text);
        font-size: clamp(18px, 2.4vw, 24px);
        font-weight: 600;
        line-height: 1.2;
      }
      .metric-label {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .map-error {
        display: none;
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 700px) {
        .reach-layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 8px;
        }
        #globe {
          width: min(100%, 380px);
        }
        .location-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 6px;
        }
        .location {
          padding: 7px 8px;
          gap: 6px;
        }
      }
      @media (max-width: 380px) {
        body {
          padding: 4px;
        }
        .reach-panel {
          padding: 16px 12px;
        }
        .location-list {
          grid-template-columns: minmax(0, 1fr);
        }
        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          row-gap: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="reach-panel" aria-labelledby="reach-title">
      <header class="reach-heading">
        <p class="reach-eyebrow">Regional Network</p>
        <h1 id="reach-title">Qatar HQ. Connected across seven countries.</h1>
        <p class="reach-intro">
          Our network spans the Gulf and Asia, with Doha as our headquarters.
        </p>
      </header>
      <div class="reach-layout">
        <div class="globe-wrap">
          <canvas
            id="globe"
            width="460"
            height="460"
            role="img"
            aria-label="Interactive dotted globe showing BSI's headquarters and regional locations"
          ></canvas>
        </div>
        <div id="location-list" class="location-list" aria-label="Office locations"></div>
      </div>
      <div class="metrics" aria-label="Network metrics">
        <div><div class="metric-value">7</div><div class="metric-label">countries</div></div>
        <div><div class="metric-value">135+</div><div class="metric-label">projects</div></div>
        <div><div class="metric-value">12</div><div class="metric-label">OEM partners</div></div>
        <div><div class="metric-value">24/7</div><div class="metric-label">support</div></div>
      </div>
      <p id="map-error" class="map-error" role="status">
        The globe is unavailable, but the location list and network metrics remain available.
      </p>
    </main>
    <script src="/translations.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="globe-dots.js"></script>
    <script>
      const accent = "#a93b55";
      const hub = {
        country: "Qatar",
        city: "Doha",
        point: [51.531, 25.285],
        detail: "HQ · Doha",
      };
      const locations = [
        { country: "KSA", city: "Dammam", point: [50.089, 26.421] },
        { country: "KSA", city: "Riyadh", point: [46.675, 24.714] },
        { country: "Bahrain", city: "Manama", point: [50.586, 26.223] },
        { country: "UAE", city: "Dubai", point: [55.271, 25.205] },
        { country: "Oman", city: "Muscat", point: [58.406, 23.588] },
        { country: "China", city: "Shanghai", point: [121.474, 31.23] },
        { country: "India", city: "Bangalore", point: [77.594, 12.972] },
      ];

      /* location list */
      const list = document.getElementById("location-list");
      [hub, ...locations].forEach((location) => {
        const item = document.createElement("div");
        item.className = "location";
        const country = document.createElement("span");
        country.className = "location-country";
        country.textContent = location.country;
        const city = document.createElement("span");
        city.className = "location-city";
        city.textContent = location.detail || location.city;
        item.setAttribute("aria-label", `${location.country}, ${city.textContent}`);
        item.append(
          Object.assign(document.createElement("span"), { className: "location-dot" }),
          country,
          city,
        );
        list.appendChild(item);
      });

      /* globe setup */
      const canvas = document.getElementById("globe");
      const context = canvas.getContext("2d");
      const size = 460;
      const scale = 215;
      const D2R = Math.PI / 180;
      const projection = d3
        .geoOrthographic()
        .scale(scale)
        .translate([size / 2, size / 2])
        .clipAngle(90);
      const path = d3.geoPath(projection, context);
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let rotation = [-hub.point[0], -hub.point[1]];
      let drag = null;
      const startTime = performance.now();

      /* land dots are pre-computed (globe-dots.js) and stored as 3D unit vectors */
      function toVectors(flat) {
        const count = flat.length / 2;
        const vectors = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          const lon = flat[i * 2] * D2R;
          const lat = flat[i * 2 + 1] * D2R;
          const cosLat = Math.cos(lat);
          vectors[i * 3] = cosLat * Math.cos(lon);
          vectors[i * 3 + 1] = cosLat * Math.sin(lon);
          vectors[i * 3 + 2] = Math.sin(lat);
        }
        return vectors;
      }

      const dots = window.GLOBE_DOTS || null;
      const landVectors = dots ? toVectors(dots.land) : new Float32Array(0);
      const highlightVectors = dots ? toVectors(dots.hi) : new Float32Array(0);
      if (!dots) document.getElementById("map-error").style.display = "block";

      /* draw every dot of one colour in a single path, using a cheap manual orthographic projection */
      function drawDots(vectors, radius, color) {
        const lambda = rotation[0] * D2R;
        const phi = rotation[1] * D2R;
        const cosL = Math.cos(lambda), sinL = Math.sin(lambda);
        const cosP = Math.cos(phi), sinP = Math.sin(phi);
        const centre = size / 2;
        context.fillStyle = color;
        context.beginPath();
        for (let i = 0; i < vectors.length; i += 3) {
          const x0 = vectors[i], y0 = vectors[i + 1], z0 = vectors[i + 2];
          const x1 = x0 * cosL - y0 * sinL;
          const y1 = x0 * sinL + y0 * cosL;
          const x2 = x1 * cosP - z0 * sinP;
          if (x2 <= 0) continue; // back of the globe
          const z2 = z0 * cosP + x1 * sinP;
          const px = centre + scale * y1;
          const py = centre - scale * z2;
          context.moveTo(px + radius, py);
          context.arc(px, py, radius, 0, Math.PI * 2);
        }
        context.fill();
      }

      function drawDot(point, radius, color) {
        const center = [-projection.rotate()[0], -projection.rotate()[1]];
        if (d3.geoDistance(point, center) > 1.55) return;
        const projected = projection(point);
        context.fillStyle = color;
        context.beginPath();
        context.arc(projected[0], projected[1], radius, 0, Math.PI * 2);
        context.fill();
      }

      const routes = locations.map((location) => {
        const interpolate = d3.geoInterpolate(hub.point, location.point);
        return {
          interpolate,
          line: { type: "LineString", coordinates: d3.range(0, 1.001, 0.02).map(interpolate) },
        };
      });
      const sphere = { type: "Sphere" };
      const graticule = d3.geoGraticule10();

      function render(time) {
        const elapsed = (time - startTime) / 1000;
        if (!drag && !reduceMotion) {
          rotation[0] = -hub.point[0] + Math.sin(elapsed * 0.25) * 5;
        }
        projection.rotate(rotation);
        context.clearRect(0, 0, size, size);

        context.beginPath();
        path(sphere);
        context.fillStyle = "#121216";
        context.fill();
        context.strokeStyle = "#333034";
        context.lineWidth = 1;
        context.stroke();

        context.beginPath();
        path(graticule);
        context.strokeStyle = "#252327";
        context.lineWidth = 0.6;
        context.stroke();

        drawDots(landVectors, 1.15, "#777176");
        drawDots(highlightVectors, 1.55, accent);

        routes.forEach((route, index) => {
          context.beginPath();
          path(route.line);
          context.strokeStyle = "rgba(169, 59, 85, 0.62)";
          context.lineWidth = 1.2;
          context.stroke();
          const pulse = reduceMotion ? 1 : (elapsed * 0.35 + index * 0.14) % 1;
          drawDot(route.interpolate(pulse), 2.4, "#ffffff");
        });

        const headquarters = projection(hub.point);
        context.fillStyle = accent;
        context.beginPath();
        context.arc(headquarters[0], headquarters[1], 4.5, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = "#ffffff";
        context.lineWidth = 1.5;
        context.stroke();
      }

      /* animation loop: only runs while the globe is actually on screen */
      let frameId = 0;
      let running = false;
      function frame(time) {
        frameId = 0;
        render(time);
        if (running && !reduceMotion) frameId = requestAnimationFrame(frame);
      }
      function start() {
        running = true;
        if (!frameId) frameId = requestAnimationFrame(frame);
      }
      function stop() {
        running = false;
        if (frameId) cancelAnimationFrame(frameId);
        frameId = 0;
      }

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(
          (entries) => (entries[entries.length - 1].isIntersecting ? start() : stop()),
          { threshold: 0 },
        ).observe(canvas);
      } else {
        start();
      }
      render(performance.now()); // first paint straight away

      /* drag to rotate */
      canvas.addEventListener("pointerdown", (event) => {
        drag = { x: event.clientX, y: event.clientY, rotation: [...rotation] };
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointermove", (event) => {
        if (!drag) return;
        rotation = [
          drag.rotation[0] + (event.clientX - drag.x) * 0.35,
          Math.max(-60, Math.min(60, drag.rotation[1] - (event.clientY - drag.y) * 0.35)),
        ];
        if (reduceMotion) requestAnimationFrame(render);
      });
      const endDrag = () => {
        drag = null;
      };
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);
    </script>
    <script>
      (() => {
        const originals = new WeakMap();
        const translate = (language) => {
          document.documentElement.lang = language;
          document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (!originals.has(node)) originals.set(node, node.data);
            const original = originals.get(node);
            const key = original.replace(/\s+/g, " ").trim();
            const leading = original.match(/^\s*/)?.[0] || "";
            const trailing = original.length === leading.length ? "" : original.match(/\s*$/)?.[0] || "";
            const translated = language === "ar" && window.BSI_AR_TRANSLATIONS[key]
              ? `${leading}${window.BSI_AR_TRANSLATIONS[key]}${trailing}`
              : original;
            const localized = language === "ar"
              ? translated.replace(/[0-9]/g, (digit) => "٠١٢٣٤٥٦٧٨٩"[Number(digit)])
              : translated;
            if (node.data !== localized) node.data = localized;
          }
          document.title = language === "ar"
            ? window.BSI_AR_TRANSLATIONS["BSI Global Reach"] || "BSI Global Reach"
            : "BSI Global Reach";
        };
        addEventListener("message", (event) => {
          if (
            event.source !== parent ||
            event.origin !== location.origin ||
            event.data?.type !== "bsi-language" ||
            !["en", "ar"].includes(event.data.language)
          ) return;
          translate(event.data.language);
        });
      })();
    </script>
  </body>
</html>
